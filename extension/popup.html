<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Captura Safra</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px; min-height: 500px; max-height: 620px;
      background: #0f1117; color: #e2e8f0;
      font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 13px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      background: #1a1d2e; border-bottom: 1px solid #2d3148;
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: #7c3aed22; display: flex; align-items: center;
      justify-content: center; font-size: 18px;
    }
    .h-title { font-weight: 700; font-size: 14px; color: #fff; }
    .h-sub   { font-size: 10px; color: #64748b; margin-top: 1px; }

    .tabs { display: flex; background: #1a1d2e; border-bottom: 1px solid #2d3148; }
    .tab {
      flex: 1; padding: 10px; text-align: center; cursor: pointer;
      font-size: 11px; font-weight: 500; color: #64748b;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .tab.active { color: #7c3aed; border-bottom-color: #7c3aed; }
    .tab:hover:not(.active) { color: #94a3b8; }

    .content { flex: 1; overflow-y: auto; padding: 12px; }
    .actions {
      background: #1a1d2e; border-top: 1px solid #2d3148;
      padding: 10px 12px; display: flex; gap: 8px;
    }
    .btn {
      flex: 1; padding: 9px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s;
    }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-secondary { background: #252840; border: 1px solid #2d3148; color: #94a3b8; }

    .card {
      background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card-name { font-weight: 600; color: #f1f5f9; font-size: 13px; }
    .card-phone { font-size: 10px; color: #7c3aed; margin-top: 2px; }
    .card-meta { font-size: 10px; color: #475569; margin-top: 3px; }
    .card-preview {
      font-size: 11px; color: #94a3b8; line-height: 1.45;
      max-height: 44px; overflow: hidden; margin-top: 6px;
    }
    .check {
      width: 18px; height: 18px; border-radius: 4px;
      border: 1px solid #2d3148; background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #fff; flex-shrink: 0;
    }
    .check.on { background: #7c3aed; border-color: #7c3aed; }

    .empty {
      text-align: center; padding: 50px 20px; color: #475569;
    }
    .empty .emoji { font-size: 36px; margin-bottom: 10px; }
    .empty p { font-size: 12px; line-height: 1.6; }

    .setting { margin-bottom: 12px; }
    .setting label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .setting input {
      width: 100%; background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 8px; padding: 8px 10px; color: #e2e8f0; font-size: 12px; outline: none;
    }
    .setting input:focus { border-color: #7c3aed; }

    .loading {
      text-align: center; padding: 40px; color: #7c3aed; font-size: 12px;
    }
    .spinner {
      width: 26px; height: 26px; border: 2px solid #2d3148;
      border-top-color: #7c3aed; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-ok  { background: #16a34a22; color: #4ade80; padding: 6px 10px; border-radius: 6px; font-size: 11px; text-align: center; }
    .status-err { background: #991b1b22; color: #f87171; padding: 6px 10px; border-radius: 6px; font-size: 11px; text-align: center; }

    .badge {
      display: inline-block; font-size: 9px; padding: 2px 6px;
      border-radius: 4px; font-weight: 600; margin-right: 4px;
    }
    .b-purple { background: #7c3aed22; color: #a78bfa; }
    .b-green  { background: #16a34a22; color: #4ade80; }
    .b-yellow { background: #ca8a0422; color: #fbbf24; }
    .b-blue   { background: #1e40af22; color: #60a5fa; }

    .result-card {
      background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .result-name { font-weight: 700; color: #f1f5f9; }
    .result-summary { font-size: 11px; color: #94a3b8; margin-top: 6px; line-height: 1.5; }
    .result-action { font-size: 11px; color: #a78bfa; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📲</div>
    <div>
      <div class="h-title">WhatsApp Captura</div>
      <div class="h-sub">Fábrica de Cortinas Girardot — Safra</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="captures">Capturas</div>
    <div class="tab" data-tab="results">Resultados</div>
    <div class="tab" data-tab="settings">Ajustes</div>
  </div>

  <div class="content" id="content"></div>
  <div class="actions" id="actions"></div>

  <script src="popup.js"></script>
</body>
</html>
